# MIMIC honeypot — example configuration.
# All values are optional; omitted keys fall back to built-in defaults.
# Pass this file as the first CLI argument:  mimic /path/to/mimic.toml

# Address to bind the SSH listener to.
listen_addr = "0.0.0.0"

# Listen port. Inside Docker keep this high (e.g. 2222) and map host port 22
# to it so the process never has to run as root.
port = 2222

# SSH identification string. Must begin with "SSH-2.0-".
server_id = "SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3"

# Hostname shown in the shell prompt.
hostname = "debian"

# Identifier included in every log line. Set a unique value per sensor when
# running multiple honeypots so you can tell their log streams apart.
sensor_name = "mimic"

# Global cap on concurrent sessions.
max_sessions = 32

# Cap on concurrent connections per source IP.
per_ip_connections = 4

# Idle timeout (seconds) before a session is dropped.
idle_timeout_secs = 300

# Absolute cap (seconds) on a single session's lifetime, regardless of activity.
# Bounds the resources any one connection can hold and prevents a client from
# keeping a session open indefinitely with periodic keep-alive traffic.
max_session_secs = 1800

# Directory where files uploaded over SCP/SFTP are quarantined. Captured payloads
# are written here named by their SHA-256 hash (content-addressed, deduplicated).
quarantine_dir = "/data/quarantine"

# Maximum number of bytes stored per uploaded file. Larger uploads are still
# fully consumed off the wire (to keep the transfer protocol in sync) but truncated
# in the quarantine store. Default: 8 MiB.
max_upload_bytes = 8388608

# Directory where SSH host keys are persisted. Keys (Ed25519 + RSA) are
# generated on first start and reused afterwards so the server fingerprint stays
# stable across restarts — a fingerprint that changes every boot is a tell.
host_key_dir = "/data/host_keys"

[logging]
# Optional file output. Forensic events are ALWAYS written as JSON lines to
# stdout (captured by Docker/journald). When `dir` is set, the same lines are
# ALSO written to a daily-rotated file `mimic.YYYY-MM-DD.jsonl` in that
# directory, ready to be tailed by a log shipper (Filebeat, Logstash, …) or
# read by hand. Leave `dir` unset to keep stdout-only logging.
dir = "/data/logs"

# How many days of rotated log files to keep. Omit this (the default) to keep
# every file forever and never delete logs. Set it to cap retention, e.g. 30
# keeps the most recent 30 daily files and prunes older ones on rotation.
# retention_days = 30

[auth]
# Acceptance strategy. One of:
#   accept_all   — every password succeeds on the first try
#   reject_all   — capture credentials without ever granting a shell
#   accept_after — succeed once a session has made `accept_after` attempts
#   credentials  — only the username/password pairs listed below succeed
mode = "accept_after"
accept_after = 2

# Used only when mode = "credentials":
# credentials = [
#   { username = "root", password = "toor" },
#   { username = "admin", password = "admin" },
# ]
