[package]
name = "mimic"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
description = "Escape-proof SSH honeypot that emulates a Debian 12 server via pure state-machine architecture."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kevin1S1/mimic-ssh-honeypot"
readme = "README.md"
keywords = ["honeypot", "ssh", "security", "deception"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "mimic"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Deliberately NOT `panic = "abort"`. SECURITY.md's per-session crash-isolation
# invariant depends on unwinding: with abort there is nothing for `tokio::spawn`
# to contain, so a panic in one session would take the listener and every other
# session down with it. Worth the binary-size cost.
strip = true

[dependencies]
anyhow = "1.0"
md-5 = "0.11"
rand = { version = "0.10", features = ["sys_rng"] }
russh = "0.63.1"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "macros", "signal"] }
toml = "1.0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
serde_json = "1.0"
