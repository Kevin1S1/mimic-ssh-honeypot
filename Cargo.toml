[package]
name = "mimic"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Escape-proof SSH honeypot that emulates a Debian 12 server via pure state-machine architecture."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kevin1S1/mimic-ssh-honeypot"
readme = "README.md"
keywords = ["honeypot", "ssh", "security", "deception"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "mimic"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.10", features = ["sys_rng"] }
russh = "0.61.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "1.0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
