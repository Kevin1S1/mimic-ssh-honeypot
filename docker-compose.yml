# MIMIC SSH Honeypot — Docker Compose deployment.
#
# Quick start:
#   docker compose up -d
#
# This maps host port 22 to the container's 2222 so the honeypot
# is reachable on the standard SSH port without running as root.

services:
  # Init container: prepares volume permissions, then exits immediately.
  mimic-init:
    image: alpine
    command: sh -c "mkdir -p /data/host_keys /data/quarantine && chown -R 65534:65534 /data"
    volumes:
      - mimic-data:/data

  mimic:
    build: .
    image: mimic-honeypot:latest
    container_name: mimic
    user: "65534:65534"
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      - "22:2222"

    volumes:
      - mimic-data:/data
      - ./deploy/mimic.toml:/etc/mimic/mimic.toml:ro

    depends_on:
      mimic-init:
        condition: service_completed_successfully

    command: ["/etc/mimic/mimic.toml"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # ── Security hardening ──────────────────────────────────────────
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0

    networks:
      - honeypot-net

  # Daily reset sidecar: picks a random time within a 3-hour window each day,
  # wipes quarantine data, and restarts the honeypot container so it starts
  # clean.  The random offset prevents restarts from always hitting the same
  # second (which would be a tell if an attacker watches uptime).
  mimic-reset:
    image: docker:27-cli
    container_name: mimic-reset
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mimic-data:/data
      - ./deploy/daily-reset.sh:/usr/local/bin/daily-reset.sh:ro

    environment:
      - MIMIC_RESET_MODE=docker
      - MIMIC_RESET_WINDOW=10800
      - MIMIC_CONTAINER=mimic
      - MIMIC_DATA_DIR=/data

    entrypoint: ["/bin/sh", "/usr/local/bin/daily-reset.sh"]

    depends_on:
      mimic:
        condition: service_started

    # The sidecar itself needs no network exposure.
    network_mode: none

    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

    # Minimal resources — the sidecar is sleeping >99.9% of the time.
    mem_limit: 32m
    cpus: 0.1

volumes:
  mimic-data:

networks:
  honeypot-net:
    driver: bridge
