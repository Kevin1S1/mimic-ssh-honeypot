# Local `cargo audit` configuration — keeps developer runs consistent with CI.
#
# Two advisories are explicitly accepted and documented in SECURITY.md: both
# are unfixable upstream and neither breaks MIMIC's core invariant. A *new*
# advisory in any dependency still fails `cargo audit`.

[advisories]
ignore = [
    # rsa Marvin timing sidechannel — host-key recovery only (impersonation of a
    # decoy), no escape; no fixed version exists upstream. Pulled in transitively
    # by `russh`.
    "RUSTSEC-2023-0071",
    # chrono unmaintained, no fixed version. Only a `cfg(target_arch = "wasm32")`
    # dependency of `russh-util`, so it is never compiled into MIMIC. cargo-deny
    # resolves the host targets and does not see it, hence no deny.toml entry.
    "RUSTSEC-2026-0543",
]
